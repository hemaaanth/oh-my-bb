name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Assign first so a list-packages.sh error fails this step instead of
      # leaving an empty matrix and a red run with no failed job.
      - id: list
        run: |
          packages="$(scripts/list-packages.sh)"
          echo "matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$packages")" >> "$GITHUB_OUTPUT"

  validate:
    needs: packages
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # Package builds run `bb plugin build`, which needs no running bb server.
      - run: npm install --global --no-audit --no-fund bb-app@0.48.1
      - run: scripts/check-package.sh ${{ matrix.package }}
